spring.application.name=api-gateway
server.port=8080

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
spring.cloud.compatibility-verifier.enabled=false

# JWT
jwt.secret=ratelimiter-secret-key-must-be-at-least-32-characters-long

# Routes
spring.cloud.gateway.mvc.routes[0].id=auth-service
spring.cloud.gateway.mvc.routes[0].uri=lb://auth-service
spring.cloud.gateway.mvc.routes[0].predicates[0]=Path=/api/auth/**

spring.cloud.gateway.mvc.routes[1].id=api-config-service
spring.cloud.gateway.mvc.routes[1].uri=lb://api-config-service
spring.cloud.gateway.mvc.routes[1].predicates[0]=Path=/api/configs/**

spring.cloud.gateway.mvc.routes[2].id=rate-limiter-service
spring.cloud.gateway.mvc.routes[2].uri=lb://rate-limiter-service
spring.cloud.gateway.mvc.routes[2].predicates[0]=Path=/api/ratelimit/**

spring.cloud.gateway.mvc.routes[3].id=analytics-service
spring.cloud.gateway.mvc.routes[3].uri=lb://analytics-service
spring.cloud.gateway.mvc.routes[3].predicates[0]=Path=/api/analytics/**